<!DOCTYPE html>
<html lang="{{ html_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('Signing out') }}</title>
</head>
<body>
    <p>{{ t('Signing out of Account Hub...') }}</p>
    <form id="account-hub-logout" method="post" action="{{ logout_url }}">
        <button type="submit">{{ t('Continue sign out') }}</button>
    </form>
    <script>
        document.getElementById('account-hub-logout').submit();
    </script>
</body>
</html>
