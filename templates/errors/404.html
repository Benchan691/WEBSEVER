<!DOCTYPE html>
<html lang="{{ html_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('404 — Page Not Found') }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/errors.css') }}" rel="stylesheet">
</head>
<body>
    <div class="text-center px-3">
        <img src="{{ url_for('serve_image', filename=image_filename) }}" alt="404"
             style="max-height: 260px; border-radius: 12px;" class="mb-4">
        <h1 class="display-4 fw-bold text-dark">404</h1>
        <p class="lead text-muted mb-4">{{ t("The page you're looking for doesn't exist.") }}</p>
        <a href="/subscriptions" class="btn btn-primary btn-lg">
            <i class="bi bi-house-door me-2"></i>{{ t('Go Home') }}
        </a>
        <div class="small mt-3 text-muted">
            <a class="text-decoration-none {{ 'fw-semibold text-dark' if locale == 'en' else 'text-muted' }}" href="{{ url_for('set_locale', code='en', next=request.full_path) }}">{{ t('EN') }}</a>
            <span class="mx-1">|</span>
            <a class="text-decoration-none {{ 'fw-semibold text-dark' if locale == 'ch' else 'text-muted' }}" href="{{ url_for('set_locale', code='ch', next=request.full_path) }}">{{ t('中文') }}</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
